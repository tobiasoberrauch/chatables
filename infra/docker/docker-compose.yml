version: "3.9"

# Financial Market Terminal - Development Stack
# Usage: docker compose up -d

services:
  # ─────────────────────────────────────────────
  # DATA STORES
  # ─────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: terminal-postgres
    environment:
      POSTGRES_DB: terminal
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal -d terminal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terminal-net

  redis:
    image: redis:7-alpine
    container_name: terminal-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terminal-net

  # ─────────────────────────────────────────────
  # APPLICATION SERVICES
  # ─────────────────────────────────────────────
  data-ingestion:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.data-ingestion
    container_name: terminal-data-ingestion
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://terminal:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/terminal
      REDIS_URL: redis://redis:6379
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      IEX_API_KEY: ${IEX_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terminal-net

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: terminal-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://terminal:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/terminal
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      JWT_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - terminal-net

  analytics:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.analytics
    container_name: terminal-analytics
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://terminal:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/terminal
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terminal-net

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: terminal-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000
      NEXT_PUBLIC_WS_URL: ws://api:3000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terminal-net

  # ─────────────────────────────────────────────
  # MONITORING
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: terminal-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - terminal-net

  grafana:
    image: grafana/grafana:10.3.0
    container_name: terminal-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - terminal-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  terminal-net:
    driver: bridge
