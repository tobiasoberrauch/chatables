global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "data-ingestion"
    static_configs:
      - targets: ["data-ingestion:9100"]
    scrape_interval: 30s

  - job_name: "analytics"
    static_configs:
      - targets: ["analytics:9100"]
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 15s
