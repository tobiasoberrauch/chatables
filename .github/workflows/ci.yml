name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────
  # Lint & Type Check
  # ─────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install shared deps
        run: cd shared && npm ci

      - name: Type check shared
        run: cd shared && npm run build

      - name: Install & lint API
        run: |
          cd services/api && npm ci
          npm run lint
          npm run typecheck

      - name: Install & lint data-ingestion
        run: |
          cd services/data-ingestion && npm ci
          npm run lint
          npm run typecheck

      - name: Install & lint analytics
        run: |
          cd services/analytics && npm ci
          npm run lint
          npm run typecheck

      - name: Install & lint frontend
        run: |
          cd frontend && npm ci
          npm run lint
          npm run typecheck

  # ─────────────────────────────────────────
  # Unit & Integration Tests
  # ─────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: terminal_test
          POSTGRES_USER: terminal
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build shared
        run: cd shared && npm ci && npm run build

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://terminal:test_password@localhost:5432/terminal_test
        run: psql "$DATABASE_URL" -f db/migrations/001_instruments.sql

      - name: Test data-ingestion
        env:
          DATABASE_URL: postgresql://terminal:test_password@localhost:5432/terminal_test
          REDIS_URL: redis://localhost:6379
        run: cd services/data-ingestion && npm ci && npm test

      - name: Test analytics
        run: cd services/analytics && npm ci && npm test

      - name: Test API
        env:
          DATABASE_URL: postgresql://terminal:test_password@localhost:5432/terminal_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
        run: cd services/api && npm ci && npm test

      - name: Test frontend
        run: cd frontend && npm ci && npm test

  # ─────────────────────────────────────────
  # Build & Push Docker Images
  # ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api, data-ingestion, analytics, frontend]

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/terminal/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/terminal/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # Deploy to ECS
  # ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster terminal-production \
            --service api \
            --force-new-deployment

      - name: Deploy data-ingestion service
        run: |
          aws ecs update-service \
            --cluster terminal-production \
            --service data-ingestion \
            --force-new-deployment

      - name: Deploy analytics service
        run: |
          aws ecs update-service \
            --cluster terminal-production \
            --service analytics \
            --force-new-deployment

      - name: Wait for API stability
        run: |
          aws ecs wait services-stable \
            --cluster terminal-production \
            --services api
